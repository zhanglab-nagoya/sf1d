# Snakemake workflow-profile for running pipeline/ on flow2-ai
# (Flow 2.0 / 不老・弐, Nagoya University Information Technology Center;
# PBS Professional scheduler). See README.md in this directory for setup
# (conda env for snakemake/polyply/intermol/packmol -- none of these are
# site modules) and for what this profile does and does not cover yet.
#
# Usage (from pipeline/, on flow2-ai):
#   snakemake --workflow-profile profiles/flow2-ai \
#       --software-deployment-method conda -c 2 segment_volume
#
# Orchestrator (this snakemake process) runs on the flow2-ai login node,
# which caps the submitting user at 9 cores / 32 GB / 72h CPU (see flow2-ai's
# own ~/CLAUDE.md, section 0.2) -- keep -c / local-cores low; it only farms
# jobs out via qsub, it doesn't need many cores itself.

executor: cluster-generic

cluster-generic-submit-cmd: python profiles/flow2-ai/submit.py
cluster-generic-cancel-cmd: qdel
cluster-generic-cancel-nargs: 50
cluster-generic-status-cmd: profiles/flow2-ai/status.sh

jobscript: profiles/flow2-ai/pbs-jobscript.sh

restart-times: 0
max-jobs-per-second: 10
max-status-checks-per-second: 1
local-cores: 2
latency-wait: 60
jobs: 50
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy

# Module loading happens unconditionally in pbs-jobscript.sh (gromacs +
# lammps both need oneapi+impi loaded first), not through Snakemake's
# envmodules: mechanism -- this pipeline's existing rules don't declare
# envmodules: blocks (unlike the sibling generate-aa-pama profiles this one
# is modeled on), so use-envmodules would do nothing here.
use-envmodules: False

# Only the real GROMACS/LAMMPS dynamics rules go through PBS; everything
# else (build_itp_oligomer, bulk_itp_hex, bulk_top, bulk_pack,
# segment_volume, vacuum_ref, solubility_chi, sf1d_predict) is marked
# `localrule: True` in the .smk files themselves and runs directly on the
# login node -- mirrors the "render_*/copy_* are localrule: True" convention
# in ../../../2026-10-28-generate-aa-pama/workflow/profiles/{isys,rccs}.
# bulk_density (gmx energy, cheap but needs the gromacs module) is kept as a
# tiny PBS job rather than local, so it doesn't need gmx_mpi loaded
# interactively in the login shell.
default-resources:
  - queue="t1-share"
  - nnumas=1
  - ompthreads=48
  - time="01:00:00"

set-resources:
  # Tiny: just `echo Density | gmx energy`, no dynamics.
  bulk_density:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 4
    time: "00:10:00"

  # Systems here are the step0/step1 bulk liquid/melt boxes (config.yaml's
  # bulk.box_nm, generous 6x6x6 nm, a few hundred to ~1k molecules) -- NOT
  # the full Fe2O3-substrate slab systems. Walltimes below are placeholders,
  # not yet benchmarked on flow2-ai; pad further if a job gets killed before
  # finishing (check logs/bulk_*/*.out, then qstat -f <id> for Exit_status).
  bulk_em:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 48
    time: "00:30:00"
  bulk_nvt:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 48
    time: "02:00:00"   # config.yaml bulk.nvt_ps = 100 ps
  bulk_npt:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 48
    time: "04:00:00"   # config.yaml bulk.npt_ps = 500 ps

  # Step 2 chis stages 4+5 (rules/step2_equilibrate.smk): the merged
  # substrate/liquid slab (~23.5k atoms -- NOT the full standalone
  # fe2o3.data substrate, ~127k atoms, which never runs dynamics on its
  # own after step2_substrate.smk) is a single-NUMA job, not an exclusive
  # node: sized from a real throughput benchmark here, job 102982.jobm,
  # 2026-11-06 -- 48 OpenMP threads (1 NUMA, t1-share) gave 17.4x over
  # this pipeline's workstation (0.111 s/step -> 0.00636 s/step), 6.8
  # ns/day/species, i.e. ~6.3 ms/step. Rewritten 2026-11-08 from one
  # `lmp_equilibrate_merged` rule into seven per-stage rules (see
  # rules/step2_equilibrate.smk's module docstring); every one below
  # needs its own entry since each is now a separate PBS job. Only
  # `lmp_production`'s walltime comes from a real benchmark (same
  # ~6.3 ms/step rate, config.yaml's slab.production_ns=10 ns -- ~35 h/
  # species real time, padded here for scheduling safety, not point
  # cost). The others are estimated from that same per-step rate against
  # their own config.yaml step counts (slab.settle_ps, restrained_npt_ps,
  # merge_nvt_ps) with generous padding, NOT independently benchmarked at
  # 48 threads -- this whole per-stage split is local-workstation-only so
  # far (smoke-tested end-to-end on ST's real data, tiny step counts),
  # never yet run on flow2-ai; treat every walltime below as a
  # placeholder to revisit once it has been.
  lmp_slab_minimize:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 48
    time: "01:00:00"
  lmp_settle:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 48
    time: "00:30:00"   # config.yaml slab.settle_ps = 20 ps, plain NVT, no barostat
  lmp_nvt:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 48
    time: "01:00:00"   # config.yaml slab.merge_nvt_ps thermalize stage
  lmp_gap_minimize:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 48
    time: "00:30:00"
  lmp_insert_minimize:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 48
    time: "01:00:00"
  lmp_insert_relax:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 48
    time: "01:00:00"   # config.yaml slab.insert_relax_ps = 10 ps
  lmp_production:
    queue: "t1-share"
    nnumas: 1
    ompthreads: 48
    time: "44:00:00"   # config.yaml slab.production_ns = 10 ns

# forcefield/substrate/fe2o3.data (~127k atoms) itself is only ever EM'd
# once by step2_substrate.smk, not run under dynamics here -- don't size a
# queue for it; the slab systems above are what actually need compute.
