# Config for the chi/chis-from-MD Snakemake pipeline.
# See pipeline/README.md for what each stage does and forcefield/chi_chis_from_md.md
# for the underlying plan this implements.

forcefield_dir: "../forcefield"

temperature_K: 300
pressure_bar: 1.0

# Step 0+1: bulk liquid / melt boxes (GROMACS).
# oligomer_length is repeat units per capped oligomer (CH3-[monomer]_n-CH3n),
# used only to get per-monomer molar volume and cohesive energy density —
# not the real chain length (see docs/usage.md on segment-size mapping).
bulk:
  oligomer_length: 10
  n_chains:
    HEX: 500 # hexadecane "melt" = the pure solvent itself
    ST: 40
    MMA: 60
  # box_nm needs margin for two separate reasons, both confirmed live
  # 2026-11-04: (1) it must exceed the real liquid volume at realistic
  # density for every species sharing this one box size (NPT then
  # compresses down) -- [6,6,6] (216 nm^3) was actually *smaller* than real
  # hexadecane (500 chains @ ~0.77 g/cm^3 needs ~244 nm^3) or ST10 melt
  # (40 chains @ ~0.9 g/cm^3 needs ~251 nm^3). (2) separately, bulk_pack's
  # packer (see its docstring) needs real spare room to place ST10's long,
  # floppy C18 tail without exhausting its iteration budget -- at 7.5 nm
  # (422 nm^3, ~1.7x ST10's needed volume) gmx insert-molecules (since
  # replaced by packmol) reliably placed only 20-34 of 40 ST10 copies even
  # at -try 5000; 10 nm (1000 nm^3, ~4x margin) reliably placed all 40.
  box_nm: [10.0, 10.0, 10.0]
  em_nsteps: 20000 # emtol=100 needed ~7600 steps for MMA's 9480-atom box; padded for margin
  nvt_ps: 100
  # Going straight from the loosely-packed box0.gro to a normal ref_p=1 bar
  # NPT doesn't work -- confirmed live 2026-11-05: density crept up barely
  # linearly (HEX: 188->218 kg/m^3 over 500 ps, nowhere near the real
  # ~770), because the barostat's response is proportional to (ref_p -
  # instantaneous pressure), and this deliberately loose box (see box_nm
  # above) starts out near-vacuum-dilute with only a small, slowly-varying
  # pressure to drive against. bulk_squeeze runs first, at a much higher
  # ref_p, to get a large driving force instead -- confirmed live for both
  # HEX and ST10: density reaches/overshoots the real target within
  # ~100-150 ps, fully stable (zero LINCS warnings). squeeze_ps=150 gives
  # that margin. The overshoot is harmless and expected (higher pressure =>
  # higher equilibrium density); bulk_npt then switches back to ref_p=1 bar
  # and relaxes the small excess quickly (confirmed: HEX dropped from the
  # squeeze's ~790 kg/m^3 to a stable ~748 kg/m^3 plateau within ~30 ps).
  squeeze_pressure_bar: 500
  squeeze_ps: 150
  # npt_discard_ps is the equilibration part of the npt_ps run (relaxing
  # the squeeze-phase overshoot back to the real ref_p=1 bar density) that
  # bulk_density skips over via `gmx energy -b` -- only [npt_discard_ps,
  # npt_ps] is averaged for the reported density. 100 ps of discard plus
  # 200 ps of production is generous given the ~30 ps relaxation observed
  # live for HEX; the margin covers ST/MMA potentially being slower to
  # settle (longer, floppier chains).
  npt_ps: 300
  npt_discard_ps: 100
  # Vacuum single-molecule reference (for the cohesive-energy-density split
  # in scripts/solubility_chi.py). Reuses mdp/nvt.mdp verbatim (same PME,
  # same 1.1 nm cutoffs as the liquid-phase runs) on the single EM'd
  # molecule in its existing 5 nm box -- confirmed live 2026-11-05 this
  # matters: an earlier attempt at a "cleaner" plain-cutoff vacuum
  # treatment (no PME) gave ST10/MMA10 *lower* solubility parameters than
  # plain hexadecane, which is physically backwards for ester-containing
  # oligomers -- the mismatched nonbonded method between vacuum and liquid
  # biased the subtraction, not the physics. Single-molecule periodic
  # images at 5 nm separation are negligible, so same-method is what
  # actually matters here, not strict non-periodicity. vacuum_nvt_ps only
  # needs to be long enough to thermally sample one molecule's own
  # conformational energy at temperature_K, not to equilibrate a box.
  vacuum_nvt_ps: 100
  vacuum_discard_ps: 20

# Step 2: dilute slab adsorption near the Fe2O3 substrate (LAMMPS).
# The dilute-adsorption rules themselves are not implemented yet -- see
# pipeline/rules/step2_chis.smk -- but the substrate they'll adsorb onto is
# now built from scratch (pipeline/rules/step2_substrate.smk) instead of
# read from a pre-built, opaque-provenance .data file, using the same
# CIF -> ASE cut/tile/trim -> INTERFACE FF charges/LJ -> LAMMPS CG-minimize
# methodology as ../2026-11-05-pama-in-nanogap's 299_substrate_creation
# stage (see forcefield/substrate/README.md for the full method/force-field
# provenance). substrate_data now points at that generated output, not the
# legacy forcefield/substrate/fe2o3.data (kept only for reference/diffing).
slab:
  substrate_data: "results/substrate/substrate_minimized.data"
  dilute_phi: 0.01 # upper-bound sanity check, not a sizing formula -- see
  # rules/step2_dilute.smk's module docstring: a single fragment in any
  # reasonably-sized solvent box is already far more dilute than this
  # (n_hex below gives ~0.0033), so this is just a check that the box
  # picked for other reasons (solvent-column depth for density profiling)
  # didn't accidentally end up too small/concentrated.
  # The adsorbing "fragment" is deliberately NOT the same ST10/MMA10 10-mer
  # oligomer step0/1 uses for bulk CED -- forcefield/chi_chis_from_md.md's
  # step 2 "whole-chain consistency check" bullet explicitly treats a real
  # multi-segment chain's adsorption as a SEPARATE validation against the
  # primary chis estimate, which should come from an isolated-segment-like
  # analog instead (chain connectivity/cooperativity would otherwise bias
  # the measured contact/bulk ratio away from a true per-segment chis).
  # fragment_length=1 is that single capped repeat unit, CH3-{species}-CH3n
  # (not oligomer_length=10's CH3-(species)_10-CH3n).
  fragment_length: 1
  n_hex: 300 # cheap but comfortable for a single fragment's density profile
  # Lateral (x,y) box dims are NOT set here -- rules/step2_dilute.smk's
  # dilute_pack reads them straight from results/substrate/
  # substrate_minimized.data, so the organic box is commensurate with the
  # Fe2O3 substrate's own relaxed footprint (fixed by the crystal lattice,
  # not something either side can cheat on) before the two are ever
  # merged. Only z is free: dilute_pack sizes it from n_hex/HEX's own
  # measured density (results/segment_volume.yaml) and volume_margin
  # below, and dilute_npt (mdp/npt_semiiso.mdp, semiisotropic coupling
  # with compressibility_xy=0) relaxes z only, keeping x,y frozen at
  # whatever dilute_pack set them to throughout.
  volume_margin: 1.12 # extra z headroom for packmol -- confirmed live
  # 2026-11-05 packing dead-on at the real density (margin=1.0) was too
  # tight for packmol's optimizer even for one small fragment (ST barely
  # converged at loop 839/1000 after ~87 min; MMA exhausted all 1000 loops
  # without converging, "ENDED WITHOUT PERFECT PACKING") -- the same
  # "packing near the true density is the hard case" lesson as bulk_pack's
  # box_nm comment, just at a smaller scale. dilute_npt's z-only
  # relaxation easily absorbs a 12% volume/density correction -- nowhere
  # near bulk_pack's 2-4x oversize that needed the squeeze-phase trick.
  em_nsteps: 10000
  nvt_ps: 50
  npt_ps: 200
  npt_discard_ps: 50
  # Deliberately much smaller than the nanogap repo's production slab
  # (16.0 x 15.5 x 5.0 nm, 126720 atoms, sized for a confined single-polymer
  # shear simulation with a ~168 A solvent column) -- step 2 only needs a
  # flat patch big enough that a dilute fragment's own periodic images
  # don't interact laterally, and thick enough (>~2x the 10 A LJ/Coulomb
  # cutoff, plus buffer) that the two surfaces don't feel each other. ~8000
  # atoms at this size vs. 126720 -- cheap to build/minimize regardless,
  # the real cost saving is in the (not yet implemented) downstream MD this
  # substrate will be merged into. Revisit if step2_chis.smk's real rules
  # turn out to need a bigger footprint.
  substrate_creation:
    cif_file: "9015964.cif" # hematite, COD https://www.crystallography.net/cod/9015964.html
    surface_miller: [0, 0, 1]
    layers: 12 # initial atomic layers cut before in-plane tiling (same as the nanogap repo -- plenty of margin for either target thickness)
    target_nm: [5.0, 5.0, 3.0] # x, y footprint, z thickness, pre-relaxation
    vacuum: 10.0 # A of z vacuum added for 2D periodicity before relaxation
    masses:
      Fe: 55.845
      O: 15.9994
    # INTERFACE force field for Fe2O3 (OPLS-AA-compatible LJ combination
    # rules/units): Kanhaiya, Krishan, et al. "Accurate force fields for
    # atomistic simulations of oxides, hydroxides, and organic hybrid
    # materials up to the micrometer scale." JCTC 19.22 (2023): 8293-8322.
    charges:
      Fe: 1.74
      O: -1.16
    pair_coeffs:
      Fe: {epsilon: 0.3, sigma: 1.853}
      O: {epsilon: 0.2, sigma: 3.127}
    cutoff: 10.0
    kspace_accuracy: 1.0e-4
    minimize:
      etol: 1.0e-8
      ftol: 1.0e-8
      maxiter: 1000
      maxeval: 10000

# Step 3: validate sf1d against MD for the real sequences.
validate:
  sequences:
    stat: null # TODO: real PSMA-stat-PMMA composition/degree of polymerization
    block: null # TODO: real PSMA-block-PMMA composition/degree of polymerization
