# Config for the chi/chis-from-MD Snakemake pipeline.
# See pipeline/README.md for what each stage does and forcefield/chi_chis_from_md.md
# for the underlying plan this implements.

forcefield_dir: "../forcefield"

temperature_K: 300
pressure_bar: 1.0

# Step 0+1: bulk liquid / melt boxes (GROMACS).
# oligomer_length is repeat units per capped oligomer (CH3-[monomer]_n-CH3n),
# used only to get per-monomer molar volume and cohesive energy density —
# not the real chain length (see docs/usage.md on segment-size mapping).
bulk:
  oligomer_length: 10
  n_chains:
    HEX: 500 # hexadecane "melt" = the pure solvent itself
    ST: 40
    MMA: 60
  # box_nm needs margin for two separate reasons, both confirmed live
  # 2026-11-04: (1) it must exceed the real liquid volume at realistic
  # density for every species sharing this one box size (NPT then
  # compresses down) -- [6,6,6] (216 nm^3) was actually *smaller* than real
  # hexadecane (500 chains @ ~0.77 g/cm^3 needs ~244 nm^3) or ST10 melt
  # (40 chains @ ~0.9 g/cm^3 needs ~251 nm^3). (2) separately, bulk_pack's
  # packer (see its docstring) needs real spare room to place ST10's long,
  # floppy C18 tail without exhausting its iteration budget -- at 7.5 nm
  # (422 nm^3, ~1.7x ST10's needed volume) gmx insert-molecules (since
  # replaced by packmol) reliably placed only 20-34 of 40 ST10 copies even
  # at -try 5000; 10 nm (1000 nm^3, ~4x margin) reliably placed all 40.
  box_nm: [10.0, 10.0, 10.0]
  em_nsteps: 20000 # emtol=100 needed ~7600 steps for MMA's 9480-atom box; padded for margin
  nvt_ps: 100
  # Going straight from the loosely-packed box0.gro to a normal ref_p=1 bar
  # NPT doesn't work -- confirmed live 2026-11-05: density crept up barely
  # linearly (HEX: 188->218 kg/m^3 over 500 ps, nowhere near the real
  # ~770), because the barostat's response is proportional to (ref_p -
  # instantaneous pressure), and this deliberately loose box (see box_nm
  # above) starts out near-vacuum-dilute with only a small, slowly-varying
  # pressure to drive against. bulk_squeeze runs first, at a much higher
  # ref_p, to get a large driving force instead -- confirmed live for both
  # HEX and ST10: density reaches/overshoots the real target within
  # ~100-150 ps, fully stable (zero LINCS warnings). squeeze_ps=150 gives
  # that margin. The overshoot is harmless and expected (higher pressure =>
  # higher equilibrium density); bulk_npt then switches back to ref_p=1 bar
  # and relaxes the small excess quickly (confirmed: HEX dropped from the
  # squeeze's ~790 kg/m^3 to a stable ~748 kg/m^3 plateau within ~30 ps).
  squeeze_pressure_bar: 500
  squeeze_ps: 150
  # npt_discard_ps is the equilibration part of the npt_ps run (relaxing
  # the squeeze-phase overshoot back to the real ref_p=1 bar density) that
  # bulk_density skips over via `gmx energy -b` -- only [npt_discard_ps,
  # npt_ps] is averaged for the reported density. 100 ps of discard plus
  # 200 ps of production is generous given the ~30 ps relaxation observed
  # live for HEX; the margin covers ST/MMA potentially being slower to
  # settle (longer, floppier chains).
  npt_ps: 300
  npt_discard_ps: 100
  # Vacuum single-molecule reference (for the cohesive-energy-density split
  # in scripts/solubility_chi.py). Reuses mdp/nvt.mdp verbatim (same PME,
  # same 1.1 nm cutoffs as the liquid-phase runs) on the single EM'd
  # molecule in its existing 5 nm box -- confirmed live 2026-11-05 this
  # matters: an earlier attempt at a "cleaner" plain-cutoff vacuum
  # treatment (no PME) gave ST10/MMA10 *lower* solubility parameters than
  # plain hexadecane, which is physically backwards for ester-containing
  # oligomers -- the mismatched nonbonded method between vacuum and liquid
  # biased the subtraction, not the physics. Single-molecule periodic
  # images at 5 nm separation are negligible, so same-method is what
  # actually matters here, not strict non-periodicity. vacuum_nvt_ps only
  # needs to be long enough to thermally sample one molecule's own
  # conformational energy at temperature_K, not to equilibrate a box.
  vacuum_nvt_ps: 100
  vacuum_discard_ps: 20

# Step 2: dilute slab adsorption near the Fe2O3 substrate (LAMMPS).
# The dilute-adsorption rules themselves are not implemented yet -- see
# pipeline/rules/step2_chis.smk -- but the substrate they'll adsorb onto is
# now built from scratch (pipeline/rules/step2_substrate.smk) instead of
# read from a pre-built, opaque-provenance .data file, using the same
# CIF -> ASE cut/tile/trim -> INTERFACE FF charges/LJ -> LAMMPS CG-minimize
# methodology as ../2026-11-05-pama-in-nanogap's 299_substrate_creation
# stage (see forcefield/substrate/README.md for the full method/force-field
# provenance). substrate_data now points at that generated output, not the
# legacy forcefield/substrate/fe2o3.data (kept only for reference/diffing).
slab:
  substrate_data: "results/substrate/substrate_minimized.data"
  merge_gap_angstrom: 3.0 # rules/step2_merge.smk / scripts/merge_slab.py:
  # buffer gap at each substrate/liquid interface (and at the periodic
  # wrap-around seam where the liquid's top meets the substrate's own
  # bottom face again) in the fully 3D-periodic sandwich this pipeline
  # merges onto -- just enough to avoid a severe initial steric clash
  # before stage 4's energy minimization (rules/step2_equilibrate.smk)
  # relaxes the interface properly; not meant to be a physically
  # meaningful spacing on its own.
  dilute_phi: 0.01 # upper-bound sanity check, not a sizing formula -- see
  # rules/step2_dilute.smk's module docstring: a single fragment in any
  # reasonably-sized solvent box is already far more dilute than this
  # (n_hex below gives ~0.0033), so this is just a check that the box
  # picked for other reasons (solvent-column depth for density profiling)
  # didn't accidentally end up too small/concentrated.
  # The adsorbing "fragment" is deliberately NOT the same ST10/MMA10 10-mer
  # oligomer step0/1 uses for bulk CED -- forcefield/chi_chis_from_md.md's
  # step 2 "whole-chain consistency check" bullet explicitly treats a real
  # multi-segment chain's adsorption as a SEPARATE validation against the
  # primary chis estimate, which should come from an isolated-segment-like
  # analog instead (chain connectivity/cooperativity would otherwise bias
  # the measured contact/bulk ratio away from a true per-segment chis).
  # fragment_length=1 is that single capped repeat unit, CH3-{species}-CH3n
  # (not oligomer_length=10's CH3-(species)_10-CH3n).
  fragment_length: 1
  n_hex: 300 # cheap but comfortable for a single fragment's density profile
  # Lateral (x,y) box dims are NOT set here -- rules/step2_dilute.smk's
  # dilute_pack reads them straight from results/substrate/
  # substrate_minimized.data, so the organic box is commensurate with the
  # Fe2O3 substrate's own relaxed footprint (fixed by the crystal lattice,
  # not something either side can cheat on) before the two are ever
  # merged. Only z is free: dilute_pack sizes it from n_hex/HEX's own
  # measured density (results/segment_volume.yaml) and volume_margin
  # below, and dilute_npt (mdp/npt_semiiso.mdp, semiisotropic coupling
  # with compressibility_xy=0) relaxes z only, keeping x,y frozen at
  # whatever dilute_pack set them to throughout.
  volume_margin: 1.12 # extra z headroom for packmol -- confirmed live
  # 2026-11-05 packing dead-on at the real density (margin=1.0) was too
  # tight for packmol's optimizer even for one small fragment (ST barely
  # converged at loop 839/1000 after ~87 min; MMA exhausted all 1000 loops
  # without converging, "ENDED WITHOUT PERFECT PACKING") -- the same
  # "packing near the true density is the hard case" lesson as bulk_pack's
  # box_nm comment, just at a smaller scale. dilute_npt's z-only
  # relaxation easily absorbs a 12% volume/density correction -- nowhere
  # near bulk_pack's 2-4x oversize that needed the squeeze-phase trick.
  em_nsteps: 10000
  nvt_ps: 50
  npt_ps: 200
  npt_discard_ps: 50

  # Step 2 chis stage 4 (rules/step2_equilibrate.smk): LAMMPS
  # minimize+NVT of the merged substrate/liquid slab. merge_cutoff_angstrom
  # matches GROMACS's rvdw/rcoulomb=1.1 nm (mdp/npt_semiiso.mdp) so the
  # merged system's nonbonded treatment stays consistent with how the
  # liquid was actually equilibrated; merge_kspace_accuracy matches
  # substrate_creation's own value below (no reason for the two to differ
  # once merged into one system).
  merge_cutoff_angstrom: 11.0
  merge_kspace_accuracy: 1.0e-4
  merge_minimize:
    # NOTE on E_vdwl: it stays large and positive (~1e5 kcal/mol)
    # throughout -- confirmed live 2026-11-06 this is NOT the interface
    # clash it looks like. The bare substrate alone (no liquid at all)
    # already has E_vdwl ~+104000 kcal/mol under this same force field:
    # for this ionic force field, the LJ channel mostly encodes
    # short-range Pauli repulsion between ions, with the actual cohesion
    # carried by the (hugely negative) Coulomb terms -- normal for an
    # ionic/ceramic system, not something minimization should or could
    # drive toward zero. The ACTUAL interface-specific strain is the
    # (tiny, ~few hundred kcal/mol) difference between the merged
    # system's E_vdwl and (bare substrate + bare organic liquid)'s E_vdwl
    # summed separately -- that is what this minimization resolves, and
    # it does, well within a few hundred steps.
    etol: 1.0e-6
    ftol: 1.0e-8
    maxiter: 1000
    maxeval: 10000
  # LAMMPS/InterMol wrote every bond (including GROMACS's LINCS-
  # constrained X-H bonds) as an explicit flexible harmonic bond, not a
  # SHAKE constraint -- confirmed live 2026-11-06 this needs a smaller
  # timestep than GROMACS's 2 fs (mdp files) to stay stable; see
  # lmp/equilibrate_merge.lmp.template's comment.
  merge_nvt_timestep_fs: 0.5
  merge_nvt_ps: 20
  merge_nvt_seed: 12345

  # Stage 4b/4d (rules/step2_equilibrate.smk, lmp/equilibrate_merge.lmp.template):
  # z-direction barostat equilibration, added 2026-11-08 after confirming
  # live that the old fixed-volume NVT left a real ~10 A vacuum gap for
  # ST and an asymmetric density profile for MMA -- the box's z-length
  # (set by merge_slab.py from a single raw, unequilibrated snapshot) was
  # never at this merged system's true equilibrium density. Barostat
  # style matters a lot here: `fix npt` (Nose-Hoover) never converges at
  # all for this system -- confirmed live 2026-11-08, it runs away to a
  # stable-but-wrong ~465 K / ~137,000 atm plateau regardless of target,
  # because the frozen substrate's own enormous internal ionic virial
  # swamps the only lever the barostat has, and Nose-Hoover's inertia
  # turns that into a runaway feedback loop. `fix press/berendsen` (no
  # inertia, direct per-step volume rescale) does not have this failure
  # mode and reaches a genuinely stable state with the SAME literal
  # target. Parameters below (including the literal 1 atm target, which
  # does work with Berendsen despite the substrate's offset) are reused
  # unchanged from the sibling ../2026-10-28-generate-aa-pama repo's
  # in/335_polymer_in_solvent_on_substrate_npt/npt.lmp.template, which
  # barostats a similarly substrate-adjacent liquid the same way -- not
  # re-tuned from scratch. x,y are never barostatted here -- only the `z`
  # keyword is passed -- so the box stays commensurate with the
  # substrate's lattice throughout, same constraint GROMACS's own
  # npt_semiiso.mdp respects in step2_dilute.smk.
  npt_pressure_atm: 1.0
  npt_pressure_damp_fs: 25000.0
  # Bulk-modulus estimate `fix press/berendsen` needs to convert a
  # pressure deviation into a volume-rescale factor -- a plausible order
  # of magnitude for a simple alkane liquid's own compressibility (not
  # meant to capture the substrate's own, much stiffer, modulus; the
  # fix's only lever is the liquid's volume regardless). Same value as
  # the sibling repo's template above.
  npt_modulus_atm: 10000.0
  # Confirmed live 2026-11-08 on ST's real merged.data: with
  # press/berendsen, the z-length contracted from 109.33 to 100.87 A
  # within 0.5 ps and then held flat for the rest of a 10 ps test run --
  # an 8.46 A contraction matching almost exactly the 8.45 A the real
  # 10 ns flow2-ai production run slowly drifted toward under passive
  # fixed-volume NVT. 100 ps gives a wide margin over that observed
  # convergence time, not yet benchmarked against watching the box
  # length plateau over the species' own full npt_z_ps; pad further if
  # npt_equilibrated.data's z-length is still visibly drifting at the
  # end of this stage.
  npt_z_ps: 100
  # After stage 4b, the fragment is moved (via LAMMPS's own xcm()/
  # displace_atoms, see the template) to the middle of the now-
  # equilibrated liquid arc, replacing whatever position
  # step2_dilute.smk's GROMACS packing happened to leave it at -- that
  # arbitrary starting position, not a deliberate choice, is exactly
  # what got swept to the box's periodic seam within the first 20 ps of
  # the old NVT stage (see module docstring). Dropping it into
  # already-occupied solvent needs the solvent to relax around it before
  # production; restraining the fragment to its new position
  # (`spring/self`, like a GROMACS position restraint) while the
  # z-barostat (now scoped to `hexadecane` only) continues keeps it from
  # drifting straight back to the seam during that relaxation. Chosen to
  # be "short" per the GROMACS posres convention (just long enough for
  # local steric/solvation relaxation, not a full equilibration in its
  # own right -- the final unrestrained NVT below still runs after this).
  fragment_restraint_k_kcal_per_mol_A2: 5.0
  restrained_npt_ps: 20

  # Stage 5 (same LAMMPS session, rules/step2_equilibrate.smk): production
  # NVT + z-resolved density profiles chis_x is read off. Sized from a real
  # throughput benchmark on flow2-ai (profiles/flow2-ai/, job 102982.jobm,
  # 2026-11-06): 6.8 ns/day/species on 1 NUMA (48 OpenMP threads,
  # t1-share) -- 10 ns costs ~35 h and ~530 points per species (~1060
  # total for ST+MMA), affordable within the group's point budget at the
  # time. This is deliberately an EXPLORATORY length, not a converged
  # one: with only a single fragment molecule in the box (slab.n_hex,
  # fragment_length above), its spontaneous sampling of both the contact
  # layer and the bulk might not converge in any feasible brute-force run
  # if it adsorbs strongly -- forcefield/chi_chis_from_md.md step 2 lists
  # umbrella-sampling PMF as the fallback for exactly this case. Check
  # results/slab/{species}/fragment_density.profile's later windows for
  # continued drift (not just the final one) before trusting chis_x from
  # it -- don't assume 10 ns was enough just because the run completed.
  production_ns: 10
  # 1 Angstrom bins resolve the contact layer (one segment ~ a few
  # Angstrom, see step 0's segment_volume.yaml) without so many bins that
  # each is under-sampled by the single fragment molecule.
  density_bin_angstrom: 1.0
  # fix ave/chunk window: sample every 0.1 ps (200 steps * 0.5 fs),
  # 500 samples/window -> 50 ps per output block (chunk_nevery *
  # chunk_nrepeat == chunk_nfreq, required by LAMMPS: Nfreq must be a
  # multiple of Nevery and span at least Nevery*Nrepeat). 10 ns / 50 ps =
  # 200 independent blocks per species to check convergence across.
  # Deliberately NOT "ave running" in the template -- see its comment.
  density_chunk_nevery: 200
  density_chunk_nrepeat: 500
  density_chunk_nfreq: 100000

  # Step 2 chis stage 6 (rules/step2_chis.smk, scripts/compute_chis.py):
  # contact-vs-bulk extraction from stage 5's {fragment,hexadecane}_
  # density.profile. Widths are multiples of the lattice segment length
  # a = a3_nm3^(1/3) (results/segment_volume.yaml, 0.7935 nm as of
  # 2026-11-06) -- ties the contact-layer definition to the same length
  # scale sf1d's own SCF lattice uses, not an arbitrary Angstrom number.
  chis_contact_width_a: 1.0
  chis_bulk_margin_a: 2.0
  # A substrate face only counts as a real liquid contact if its own
  # mean hexadecane density is at least this fraction of the bulk
  # reference density. Confirmed live 2026-11-08 this matters: ST's
  # production run left a real ~10 A vacuum gap at the liquid's far
  # (wrap-around) surface -- the intended "periodic sandwich" didn't
  # fully close for that species, so a genuine liquid-vacuum free
  # surface formed there instead of a second substrate contact -- while
  # MMA's did wrap around and touch the substrate's other face as
  # designed. Pooling a vacuum-bordering face into the contact average
  # would dilute the real contact-layer signal with an unrelated
  # free-surface effect, so each face is checked and excluded if invalid.
  chis_min_contact_density_fraction: 0.3
  # Fraction of the retained production windows' data to discard from
  # the START of the run before averaging -- stage 4's own separate NVT
  # equilibration already ran first, so this is a small extra margin,
  # not the primary equilibration.
  chis_discard_fraction: 0.1
  # Heuristic only (see production_ns's comment above on the single-
  # fragment convergence risk): flags chis_x as "not converged" if the
  # running cumulative estimate changes by more than this between the
  # halfway point and the end of the retained windows. Not a rigorous
  # statistical test -- a single fragment molecule's sampling can still
  # be wrong even if this check passes; the honest fallback for a
  # flagged species is a longer run or the umbrella-sampling PMF route
  # (forcefield/chi_chis_from_md.md step 2).
  chis_convergence_tol: 0.15

  # Deliberately much smaller than the nanogap repo's production slab
  # (16.0 x 15.5 x 5.0 nm, 126720 atoms, sized for a confined single-polymer
  # shear simulation with a ~168 A solvent column) -- step 2 only needs a
  # flat patch big enough that a dilute fragment's own periodic images
  # don't interact laterally, and thick enough (>~2x the 10 A LJ/Coulomb
  # cutoff, plus buffer) that the two surfaces don't feel each other. ~8000
  # atoms at this size vs. 126720 -- cheap to build/minimize regardless,
  # the real cost saving is in the (not yet implemented) downstream MD this
  # substrate will be merged into. Revisit if step2_chis.smk's real rules
  # turn out to need a bigger footprint.
  substrate_creation:
    cif_file: "9015964.cif" # hematite, COD https://www.crystallography.net/cod/9015964.html
    surface_miller: [0, 0, 1]
    layers: 12 # initial atomic layers cut before in-plane tiling (same as the nanogap repo -- plenty of margin for either target thickness)
    target_nm: [5.0, 5.0, 3.0] # x, y footprint, z thickness, pre-relaxation
    vacuum: 10.0 # A of z vacuum added for 2D periodicity before relaxation
    masses:
      Fe: 55.845
      O: 15.9994
    # INTERFACE force field for Fe2O3 (OPLS-AA-compatible LJ combination
    # rules/units): Kanhaiya, Krishan, et al. "Accurate force fields for
    # atomistic simulations of oxides, hydroxides, and organic hybrid
    # materials up to the micrometer scale." JCTC 19.22 (2023): 8293-8322.
    charges:
      Fe: 1.74
      O: -1.16
    pair_coeffs:
      Fe: {epsilon: 0.3, sigma: 1.853}
      O: {epsilon: 0.2, sigma: 3.127}
    cutoff: 10.0
    kspace_accuracy: 1.0e-4
    minimize:
      etol: 1.0e-8
      ftol: 1.0e-8
      maxiter: 1000
      maxeval: 10000

# Step 3: validate sf1d against MD for the real sequences.
validate:
  sequences:
    stat: null # TODO: real PSMA-stat-PMMA composition/degree of polymerization
    block: null # TODO: real PSMA-block-PMMA composition/degree of polymerization
